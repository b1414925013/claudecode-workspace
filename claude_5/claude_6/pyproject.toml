[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pyhutool"
version = "0.1.0"
description = "Hutool 风格的 Python 工具库：外部 API 对齐 Hutool，内部用现代 Python 重新实现"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "pyhutool contributors" }]
keywords = ["hutool", "util", "toolkit", "utility"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []  # 核心零依赖

[project.optional-dependencies]
http = ["httpx>=0.27"]
json = ["orjson>=3.10"]
crypto = ["cryptography>=43"]
jwt = ["pyjwt>=2.9", "cryptography>=43"]
cron = ["APScheduler>=3.10"]
ssh = ["paramiko>=3.4"]
all = ["pyhutool[http,json,crypto,jwt,cron,ssh]"]

[project.urls]
Homepage = "https://github.com/pyhutool/pyhutool"
Documentation = "https://pyhutool.github.io"
Repository = "https://github.com/pyhutool/pyhutool"

[tool.hatch.build.targets.wheel]
packages = ["src/pyhutool"]

# ---------- 代码风格：ruff（集成 isort 规则）+ black ----------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "C4",      # comprehensions
    "SIM",     # simplify
    "RUF",     # ruff-specific
]
# RUF001/002/003 会把中文全角标点（（）：，）误判为歧义字符，禁用
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["pyhutool"]

[tool.black]
line-length = 100
target-version = ["py311"]

# ---------- 类型检查：mypy 严格 ----------
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_reexport = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
files = ["src/pyhutool"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = false

# 可选依赖：未安装时让 mypy 静默忽略，避免 CI 失败
[[tool.mypy.overrides]]
module = "orjson"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "httpx"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "cryptography"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "jwt"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "apscheduler.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "paramiko"
ignore_missing_imports = true

# ---------- 测试：pytest ----------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/pyhutool"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
fail_under = 85
