name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-type-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install uv
        run: pip install uv

      - name: Install package & dev dependencies
        run: |
          uv pip install --system -e ".[all]"
          uv pip install --system ruff black isort mypy pytest pytest-asyncio pytest-cov

      - name: Ruff check
        run: ruff check src tests

      - name: Black check
        run: black --check src tests

      - name: isort check
        run: isort --check-only src tests

      - name: Mypy strict
        run: mypy

      - name: Pytest with coverage
        run: pytest --cov=pyhutool --cov-report=xml --cov-report=term-missing

      - name: Enforce coverage threshold
        run: pytest --cov=pyhutool --cov-fail-under=85 -q

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
          path: coverage.xml
