<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>告警设备拓扑关系 - 3D 可视化</title>
    <style>
        /* 页面基础样式 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: #0a0a1a;
            color: #fff;
            overflow: hidden;
        }
        #container { width: 100vw; height: 100vh; }

        /* 图例面板 */
        #legend {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(20, 20, 40, 0.95);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 20px;
            min-width: 240px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        #legend h3 {
            font-size: 16px;
            margin-bottom: 16px;
            color: #00d4ff;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin: 10px 0;
            font-size: 13px;
        }
        .legend-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            margin-right: 10px;
            box-shadow: 0 0 10px currentColor;
        }
        .legend-line {
            width: 30px;
            height: 3px;
            margin-right: 10px;
            border-radius: 2px;
        }

        /* 控制面板 */
        #controls {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(20, 20, 40, 0.95);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }
        #controls h3 {
            font-size: 14px;
            margin-bottom: 12px;
            color: #00d4ff;
        }
        .control-row {
            display: flex;
            align-items: center;
            margin: 8px 0;
            font-size: 13px;
        }
        .control-row label { min-width: 80px; color: #aaa; }
        .control-row input[type="range"] {
            width: 120px;
            margin: 0 10px;
        }
        .control-row span { min-width: 40px; text-align: right; color: #00d4ff; }

        /* 节点信息面板 */
        #nodeInfo {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(20, 20, 40, 0.95);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 16px 20px;
            min-width: 260px;
            backdrop-filter: blur(10px);
            display: none;
        }
        #nodeInfo h4 { color: #00d4ff; margin-bottom: 8px; font-size: 14px; }
        #nodeInfo p { font-size: 13px; color: #ccc; margin: 4px 0; }
        #nodeInfo .highlight { color: #ff6b6b; font-weight: bold; }

        /* 操作提示 */
        #tips {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(20, 20, 40, 0.9);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 16px;
            font-size: 12px;
            color: #888;
            backdrop-filter: blur(10px);
        }
        #tips div { margin: 4px 0; }
        #tips span { color: #00d4ff; }
    </style>
</head>
<body>
    <div id="container"></div>

    <!-- 图例 -->
    <div id="legend">
        <h3>图例</h3>
        <div class="legend-item">
            <svg width="20" height="20" viewBox="0 0 20 20" style="margin-right:10px;">
                <polygon points="10,2 18,10 10,18 2,10" fill="#ff6b6b" stroke="#ff6b6b"/>
            </svg>
            <span>告警 (alarm)</span>
            <span style="color:#888;margin-left:8px;">— 八面体</span>
        </div>
        <div class="legend-item">
            <svg width="20" height="20" viewBox="0 0 20 20" style="margin-right:10px;">
                <polygon points="10,2 18,7 18,13 10,18 2,13 2,7" fill="#00d4ff" stroke="#00d4ff"/>
            </svg>
            <span>网元 (ne)</span>
            <span style="color:#888;margin-left:8px;">— 六边形</span>
        </div>
        <div class="legend-item">
            <svg width="20" height="20" viewBox="0 0 20 20" style="margin-right:10px;">
                <rect x="2" y="7" width="16" height="6" fill="#4fc3f7" stroke="#4fc3f7"/>
            </svg>
            <span>单板 (board)</span>
            <span style="color:#888;margin-left:8px;">— 长方体</span>
        </div>
        <div class="legend-item">
            <svg width="20" height="20" viewBox="0 0 20 20" style="margin-right:10px;">
                <rect x="5" y="5" width="10" height="10" fill="#81d4fa" stroke="#81d4fa"/>
            </svg>
            <span>端口 (port)</span>
            <span style="color:#888;margin-left:8px;">— 立方体</span>
        </div>
        <div style="margin-top:16px;border-top:1px solid rgba(255,255,255,0.1);padding-top:12px;">
            <div class="legend-item">
                <div class="legend-line" style="background:#ff9800;"></div>
                <span>trigger (告警→告警)</span>
            </div>
            <div class="legend-item">
                <div class="legend-line" style="background:#e91e63;"></div>
                <span>happen (告警→设备)</span>
            </div>
            <div class="legend-item">
                <div class="legend-line" style="background:#9c27b0;"></div>
                <span>enhance (告警→设备)</span>
            </div>
            <div class="legend-item">
                <div class="legend-line" style="background:#4caf50;"></div>
                <span>leave (设备父子)</span>
            </div>
            <div class="legend-item">
                <div class="legend-line" style="background:#2196f3;"></div>
                <span>link (设备连接)</span>
            </div>
        </div>
    </div>

    <!-- 控制面板 -->
    <div id="controls">
        <h3>参数控制</h3>
        <div class="control-row">
            <label>节点大小</label>
            <input type="range" id="nodeSize" min="0.5" max="2" step="0.1" value="1">
            <span id="nodeSizeVal">1.0</span>
        </div>
        <div class="control-row">
            <label>旋转速度</label>
            <input type="range" id="rotSpeed" min="0" max="2" step="0.1" value="0.3">
            <span id="rotSpeedVal">0.3</span>
        </div>
        <div class="control-row">
            <label>边厚度</label>
            <input type="range" id="lineWidth" min="0.5" max="3" step="0.1" value="1">
            <span id="lineWidthVal">1.0</span>
        </div>
    </div>

    <!-- 节点信息面板 -->
    <div id="nodeInfo">
        <h4>节点信息</h4>
        <p>类型: <span class="highlight" id="infoType">-</span></p>
        <p>名称: <span class="highlight" id="infoName">-</span></p>
        <p>连接数: <span class="highlight" id="infoConn">-</span></p>
    </div>

    <!-- 操作提示 -->
    <div id="tips">
        <div><span>拖拽</span> 旋转视角</div>
        <div><span>滚轮</span> 缩放</div>
        <div><span>右键拖拽</span> 平移</div>
        <div><span>点击节点</span> 查看详情</div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ========== 节点和边的数据模型 ==========
        // 定义拓扑数据
        const graphData = {
            nodes: [
                // 告警节点
                { id: 'alarm1', type: 'alarm', name: '告警A-端口故障' },
                { id: 'alarm2', type: 'alarm', name: '告警B-链路中断' },
                { id: 'alarm3', type: 'alarm', name: '告警C-单板异常' },

                // 网元
                { id: 'ne1', type: 'ne', name: '核心路由器R1' },
                { id: 'ne2', type: 'ne', name: '汇聚交换机S1' },

                // 单板
                { id: 'board1', type: 'board', name: '主控板M1' },
                { id: 'board2', type: 'board', name: '业务板L1' },
                { id: 'board3', type: 'board', name: '业务板L2' },

                // 端口
                { id: 'port1', type: 'port', name: '万兆口G1/0/1' },
                { id: 'port2', type: 'port', name: '千兆口G1/0/2' },
                { id: 'port3', type: 'port', name: '百兆口G2/0/1' },
                { id: 'port4', type: 'port', name: '环网口ETH1' },
            ],
            edges: [
                // 告警间衍生关系 (trigger)
                { source: 'alarm1', target: 'alarm2', type: 'trigger' },
                { source: 'alarm2', target: 'alarm3', type: 'trigger' },

                // 设备父子关系 (leave)
                { source: 'ne1', target: 'board1', type: 'leave' },
                { source: 'ne1', target: 'board2', type: 'leave' },
                { source: 'ne2', target: 'board3', type: 'leave' },
                { source: 'board1', target: 'port1', type: 'leave' },
                { source: 'board1', target: 'port2', type: 'leave' },
                { source: 'board2', target: 'port3', type: 'leave' },
                { source: 'board3', target: 'port4', type: 'leave' },

                // 设备间连接关系 (link)
                { source: 'port1', target: 'port3', type: 'link' },
                { source: 'port2', target: 'port4', type: 'link' },

                // 告警与设备关联 (happen/enhance)
                { source: 'alarm1', target: 'port1', type: 'happen' },
                { source: 'alarm1', target: 'board1', type: 'enhance' },
                { source: 'alarm2', target: 'port3', type: 'happen' },
                { source: 'alarm2', target: 'ne2', type: 'enhance' },
                { source: 'alarm3', target: 'board2', type: 'happen' },
                { source: 'alarm3', target: 'ne1', type: 'enhance' },
            ]
        };

        // ========== 颜色配置 ==========
        const nodeColors = {
            alarm: 0xff6b6b,    // 红色
            ne: 0x00d4ff,       // 青色
            board: 0x4fc3f7,    // 浅蓝
            port: 0x81d4fa      // 更浅蓝
        };

        const edgeColors = {
            trigger: 0xff9800,  // 橙色
            happen: 0xe91e63,   // 粉红
            enhance: 0x9c27b0,  // 紫色
            leave: 0x4caf50,    // 绿色
            link: 0x2196f3      // 蓝色
        };

        // ========== Three.js 场景初始化 ==========
        const container = document.getElementById('container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a1a);

        // 添加星空背景
        const starGeo = new THREE.BufferGeometry();
        const starCount = 2000;
        const starPositions = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount * 3; i++) {
            starPositions[i] = (Math.random() - 0.5) * 200;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.1 });
        const stars = new THREE.Points(starGeo, starMat);
        scene.add(stars);

        // 相机
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(20, 15, 25);

        // 渲染器
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // 轨道控制器
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.rotateSpeed = 0.5;
        controls.zoomSpeed = 0.8;

        // 灯光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);
        const pointLight = new THREE.PointLight(0x00d4ff, 0.5, 50);
        pointLight.position.set(-10, 10, -10);
        scene.add(pointLight);

        // ========== 节点和边存储 ==========
        const nodeObjects = {};      // 存储节点 mesh
        const edgeObjects = [];      // 存储边 line
        const nodeMeshes = [];       // 可点击的节点列表

        // 创建节点 - 根据类型使用不同几何体
        function createNode(nodeData) {
            const group = new THREE.Group();
            const color = nodeColors[nodeData.type];
            const size = nodeData.type === 'alarm' ? 0.9 : 0.7;

            let geo, mesh;

            // 根据节点类型选择几何体
            switch(nodeData.type) {
                case 'alarm':
                    // 告警: 八面体(菱形,尖锐警示)
                    geo = new THREE.OctahedronGeometry(size, 0);
                    const mat = new THREE.MeshStandardMaterial({
                        color: color,
                        emissive: color,
                        emissiveIntensity: 0.4,
                        metalness: 0.5,
                        roughness: 0.3,
                        flatShading: true
                    });
                    mesh = new THREE.Mesh(geo, mat);
                    break;

                case 'ne':
                    // 网元: 六边形棱柱(蜂窝网络)
                    const hexGeo = new THREE.CylinderGeometry(size, size, size * 0.6, 6);
                    const hexMat = new THREE.MeshStandardMaterial({
                        color: color,
                        emissive: color,
                        emissiveIntensity: 0.3,
                        metalness: 0.4,
                        roughness: 0.4
                    });
                    mesh = new THREE.Mesh(hexGeo, hexMat);
                    // 添加顶部装饰
                    const topCap = new THREE.Mesh(
                        new THREE.CylinderGeometry(size * 0.3, size * 0.3, size * 0.2, 6),
                        new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 0.2 })
                    );
                    topCap.position.y = size * 0.4;
                    group.add(topCap);
                    break;

                case 'board':
                    // 单板: 长方体(电路板形状)
                    const boardGeo = new THREE.BoxGeometry(size * 1.2, size * 0.3, size * 0.8);
                    const boardMat = new THREE.MeshStandardMaterial({
                        color: color,
                        emissive: color,
                        emissiveIntensity: 0.3,
                        metalness: 0.3,
                        roughness: 0.5
                    });
                    mesh = new THREE.Mesh(boardGeo, boardMat);
                    // 添加小元件装饰
                    for (let i = 0; i < 3; i++) {
                        const chip = new THREE.Mesh(
                            new THREE.BoxGeometry(size * 0.15, size * 0.1, size * 0.15),
                            new THREE.MeshStandardMaterial({ color: 0x333333 })
                        );
                        chip.position.set((i - 1) * size * 0.3, size * 0.2, 0);
                        group.add(chip);
                    }
                    break;

                case 'port':
                    // 端口: 小立方体(接口形状)
                    const portGeo = new THREE.BoxGeometry(size * 0.6, size * 0.6, size * 0.6);
                    const portMat = new THREE.MeshStandardMaterial({
                        color: color,
                        emissive: color,
                        emissiveIntensity: 0.3,
                        metalness: 0.4,
                        roughness: 0.4
                    });
                    mesh = new THREE.Mesh(portGeo, portMat);
                    // 添加指示灯
                    const ledGeo = new THREE.SphereGeometry(size * 0.08, 8, 8);
                    const ledMat = new THREE.MeshStandardMaterial({
                        color: 0x00ff00,
                        emissive: 0x00ff00,
                        emissiveIntensity: 0.5
                    });
                    const led = new THREE.Mesh(ledGeo, ledMat);
                    led.position.set(0, size * 0.35, size * 0.35);
                    group.add(led);
                    break;
            }

            mesh.castShadow = true;
            mesh.userData = nodeData;
            group.add(mesh);

            // 光晕效果
            const glowGeo = new THREE.SphereGeometry(size * 1.5, 16, 16);
            const glowMat = new THREE.MeshBasicMaterial({
                color: color,
                transparent: true,
                opacity: 0.12
            });
            const glow = new THREE.Mesh(glowGeo, glowMat);
            group.add(glow);

            // 标签
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'white';
            ctx.font = 'bold 22px Microsoft YaHei';
            ctx.textAlign = 'center';
            ctx.fillText(nodeData.name, 128, 40);
            const texture = new THREE.CanvasTexture(canvas);
            const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true });
            const sprite = new THREE.Sprite(spriteMat);
            sprite.scale.set(3.5, 0.875, 1);
            sprite.position.y = size + 1.2;
            group.add(sprite);

            group.userData = nodeData;
            nodeMeshes.push(mesh);
            return group;
        }

        // 创建边
        function createEdge(edgeData, sourcePos, targetPos) {
            const color = edgeColors[edgeData.type];
            const points = [sourcePos, targetPos];
            const geo = new THREE.BufferGeometry().setFromPoints(points);

            // 根据边类型选择样式
            let lineWidth = 1;
            let dashed = false;
            let dashSize = 0.2;
            let gapSize = 0.1;

            if (edgeData.type === 'trigger') {
                lineWidth = 2;
            } else if (edgeData.type === 'happen' || edgeData.type === 'enhance') {
                dashed = true;
            }

            const mat = new THREE.LineBasicMaterial({
                color: color,
                linewidth: lineWidth,
                transparent: true,
                opacity: 0.8
            });

            let line;
            if (dashed) {
                // 虚线效果用多个小线段实现
                const segments = 8;
                const subLines = [];
                for (let i = 0; i < segments; i += 2) {
                    const startT = i / segments;
                    const endT = (i + 1) / segments;
                    const start = new THREE.Vector3().lerpVectors(sourcePos, targetPos, startT);
                    const end = new THREE.Vector3().lerpVectors(sourcePos, targetPos, endT);
                    const segGeo = new THREE.BufferGeometry().setFromPoints([start, end]);
                    const segLine = new THREE.Line(segGeo, mat.clone());
                    subLines.push(segLine);
                }
                line = new THREE.Group();
                subLines.forEach(sl => line.add(sl));
            } else {
                line = new THREE.Line(geo, mat);
            }

            // 添加箭头指示方向
            const dir = new THREE.Vector3().subVectors(targetPos, sourcePos).normalize();
            const arrowGeo = new THREE.ConeGeometry(0.15, 0.4, 8);
            const arrowMat = new THREE.MeshBasicMaterial({ color: color });
            const arrow = new THREE.Mesh(arrowGeo, arrowMat);
            arrow.position.copy(targetPos).addScaledVector(dir, -0.3);
            arrow.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
            arrow.visible = !(edgeData.type === 'leave'); // leave边不显示箭头

            if (dashed) {
                line.add(arrow);
            } else {
                line.add(arrow);
            }

            line.userData = edgeData;
            return line;
        }

        // ========== 布局算法 ==========
        // 使用分层布局
        function calculateLayout() {
            const positions = {};
            const layers = {
                alarm: [],
                ne: [],
                board: [],
                port: []
            };

            // 按类型分组
            graphData.nodes.forEach(node => {
                layers[node.type].push(node);
            });

            // 计算每层的位置
            const layerSpacing = { x: 8, y: 5 };

            // alarm 层 - 最上层 (z 最前)
            const alarmCount = layers.alarm.length;
            layers.alarm.forEach((node, i) => {
                const angle = (i / Math.max(alarmCount - 1, 1) - 0.5) * Math.PI * 0.8;
                positions[node.id] = new THREE.Vector3(
                    Math.sin(angle) * 5,
                    6,
                    Math.cos(angle) * 2 + 2
                );
            });

            // ne 层 - 第二层
            const neCount = layers.ne.length;
            layers.ne.forEach((node, i) => {
                positions[node.id] = new THREE.Vector3(
                    (i - (neCount - 1) / 2) * 6,
                    2,
                    0
                );
            });

            // board 层 - 第三层
            const boardCount = layers.board.length;
            layers.board.forEach((node, i) => {
                positions[node.id] = new THREE.Vector3(
                    (i - (boardCount - 1) / 2) * 5,
                    -2,
                    0
                );
            });

            // port 层 - 最底层
            const portCount = layers.port.length;
            layers.port.forEach((node, i) => {
                positions[node.id] = new THREE.Vector3(
                    (i - (portCount - 1) / 2) * 4,
                    -6,
                    (i % 2) * 2 - 1
                );
            });

            return positions;
        }

        // ========== 构建图 ==========
        const nodePositions = calculateLayout();

        // 创建节点
        graphData.nodes.forEach(node => {
            const obj = createNode(node);
            obj.position.copy(nodePositions[node.id]);
            scene.add(obj);
            nodeObjects[node.id] = obj;
        });

        // 创建边
        graphData.edges.forEach(edge => {
            const sourcePos = nodePositions[edge.source];
            const targetPos = nodePositions[edge.target];
            const line = createEdge(edge, sourcePos, targetPos);
            scene.add(line);
            edgeObjects.push(line);
        });

        // ========== 节点点击交互 ==========
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const nodeInfo = document.getElementById('nodeInfo');

        function onMouseClick(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(nodeMeshes);

            if (intersects.length > 0) {
                const nodeData = intersects[0].object.userData;

                // 高亮选中节点
                nodeMeshes.forEach(m => {
                    m.material.emissiveIntensity = m === intersects[0].object ? 0.8 : 0.3;
                });

                // 计算连接数
                const connections = graphData.edges.filter(
                    e => e.source === nodeData.id || e.target === nodeData.id
                ).length;

                // 更新信息面板
                document.getElementById('infoType').textContent = nodeData.type.toUpperCase();
                document.getElementById('infoName').textContent = nodeData.name;
                document.getElementById('infoConn').textContent = connections;
                nodeInfo.style.display = 'block';
            } else {
                // 取消高亮
                nodeMeshes.forEach(m => {
                    m.material.emissiveIntensity = 0.3;
                });
                nodeInfo.style.display = 'none';
            }
        }

        window.addEventListener('click', onMouseClick);

        // ========== 参数控制 ==========
        let autoRotateSpeed = 0.3;
        document.getElementById('rotSpeed').addEventListener('input', (e) => {
            autoRotateSpeed = parseFloat(e.target.value);
            document.getElementById('rotSpeedVal').textContent = autoRotateSpeed.toFixed(1);
        });

        document.getElementById('nodeSize').addEventListener('input', (e) => {
            const scale = parseFloat(e.target.value);
            document.getElementById('nodeSizeVal').textContent = scale.toFixed(1);
            graphData.nodes.forEach(node => {
                const obj = nodeObjects[node.id];
                obj.children[0].scale.setScalar(scale); // 主体球
                obj.children[1].scale.setScalar(scale); // 光晕
            });
        });

        // ========== 窗口大小调整 ==========
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ========== 动画循环 ==========
        function animate() {
            requestAnimationFrame(animate);

            // 自动旋转
            if (autoRotateSpeed > 0) {
                scene.rotation.y += autoRotateSpeed * 0.005;
            }

            // 节点呼吸动画
            const time = Date.now() * 0.001;
            nodeMeshes.forEach((mesh, i) => {
                const baseScale = parseFloat(document.getElementById('nodeSize').value);
                const pulse = 1 + Math.sin(time * 2 + i) * 0.05;
                if (mesh.parent.children[0] === mesh) {
                    // 只缩放主体球,不影响光晕
                }
            });

            // 光晕呼吸效果
            Object.values(nodeObjects).forEach((obj, i) => {
                const glow = obj.children[1];
                const pulse = 0.15 + Math.sin(time * 2 + i * 0.5) * 0.05;
                glow.material.opacity = pulse;
            });

            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
