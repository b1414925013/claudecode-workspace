<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简化U型网元故障组 - 3D 可视化</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: #0a0a1a;
            color: #fff;
            overflow: hidden;
        }
        #container { width: 100vw; height: 100vh; }

        /* 标题栏 */
        #titleBar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-bottom: 1px solid rgba(255,102,0,0.3);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #titleBar h1 {
            color: #ff6600;
            font-size: 20px;
        }
        #titleBar .subtitle {
            color: #888;
            font-size: 13px;
        }

        /* 图例面板 */
        #legend {
            position: fixed;
            top: 80px;
            left: 20px;
            background: rgba(20, 20, 40, 0.95);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 20px;
            min-width: 260px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        #legend h3 {
            font-size: 15px;
            margin-bottom: 14px;
            color: #00d4ff;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 8px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin: 8px 0;
            font-size: 13px;
        }

        /* 故障组详情面板 */
        #faultPanel {
            position: fixed;
            top: 80px;
            right: 20px;
            background: rgba(20, 20, 40, 0.95);
            border: 2px solid #ff6600;
            border-radius: 12px;
            padding: 20px;
            width: 320px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(255,102,0,0.2);
        }
        #faultPanel h3 {
            color: #ff6600;
            font-size: 16px;
            margin-bottom: 16px;
            text-align: center;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,102,0,0.3);
        }
        .fault-group {
            background: rgba(255,102,0,0.1);
            border: 1px solid rgba(255,102,0,0.4);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 12px;
        }
        .fault-group:last-child { margin-bottom: 0; }
        .fault-group-title {
            color: #ff6600;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .fault-group-info {
            font-size: 12px;
            color: #aaa;
            margin: 4px 0;
        }
        .alarm-tag {
            display: inline-block;
            background: rgba(255,107,107,0.2);
            color: #ff6b6b;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            margin: 3px 3px 3px 0;
        }

        /* 规则说明面板 */
        #rulesPanel {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(20, 20, 40, 0.95);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 16px 20px;
            max-width: 400px;
            backdrop-filter: blur(10px);
        }
        #rulesPanel h4 {
            color: #00d4ff;
            font-size: 14px;
            margin-bottom: 10px;
        }
        #rulesPanel p {
            font-size: 12px;
            color: #aaa;
            margin: 6px 0;
            line-height: 1.5;
        }
        #rulesPanel .highlight {
            color: #ff6600;
            font-weight: bold;
        }

        /* 操作提示 */
        #tips {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(20, 20, 40, 0.9);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 14px;
            font-size: 12px;
            color: #888;
        }
        #tips div { margin: 4px 0; }
        #tips span { color: #00d4ff; }
    </style>
</head>
<body>
    <div id="container"></div>

    <!-- 标题栏 -->
    <div id="titleBar">
        <h1>简化U型网元故障组</h1>
        <span class="subtitle">两个网元直接link连接，各有1个告警形成U型故障组</span>
    </div>

    <!-- 图例 -->
    <div id="legend">
        <h3>图例</h3>
        <div class="legend-item">
            <svg width="20" height="20" viewBox="0 0 20 20" style="margin-right:10px;">
                <polygon points="10,2 18,10 10,18 2,10" fill="#ff6b6b" stroke="#ff6b6b"/>
            </svg>
            <span>告警 (alarm)</span>
            <span style="color:#888;margin-left:8px;">— 八面体</span>
        </div>
        <div class="legend-item">
            <svg width="20" height="20" viewBox="0 0 20 20" style="margin-right:10px;">
                <polygon points="10,2 18,7 18,13 10,18 2,13 2,7" fill="#00d4ff" stroke="#00d4ff"/>
            </svg>
            <span>网元 (ne)</span>
            <span style="color:#888;margin-left:8px;">— 六边形</span>
        </div>
        <div style="margin-top:16px;border-top:1px solid rgba(255,255,255,0.1);padding-top:12px;">
            <div class="legend-item">
                <div style="width:30px;height:3px;background:#ff6600;border-radius:2px;margin-right:10px;"></div>
                <span>U型故障组包围圈</span>
            </div>
            <div class="legend-item">
                <div style="width:30px;height:2px;background:#ffc107;margin-right:10px;"></div>
                <span>trigger (告警关联)</span>
            </div>
            <div class="legend-item">
                <div style="width:30px;height:2px;background:#e91e63;margin-right:10px;"></div>
                <span>happen (告警→网元)</span>
            </div>
            <div class="legend-item">
                <div style="width:30px;height:2px;background:#2196f3;margin-right:10px;"></div>
                <span>link (网元连接)</span>
            </div>
        </div>
    </div>

    <!-- 故障组详情面板 -->
    <div id="faultPanel">
        <h3>⚠️ U型故障组</h3>
        <div id="faultGroupList"></div>
        <div id="noFaultGroup" style="text-align:center;color:#666;font-size:13px;padding:20px;">
            暂无U型网元故障组
        </div>
    </div>

    <!-- 规则说明 -->
    <div id="rulesPanel">
        <h4>简化U型故障组识别规则</h4>
        <p>1. 存在 <span class="highlight">2个网元</span></p>
        <p>2. 两个网元之间有 <span class="highlight">link 直接连接</span></p>
        <p>3. 每个网元上有 <span class="highlight">1个告警</span>（通过 happen 关联）</p>
        <p>4. 满足以上条件形成 U型网元故障组</p>
    </div>

    <!-- 操作提示 -->
    <div id="tips">
        <div><span>拖拽</span> 旋转视角</div>
        <div><span>滚轮</span> 缩放</div>
        <div><span>右键拖拽</span> 平移</div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ========== 简化拓扑数据模型 ==========
        // 只包含两个网元，直接 link 连接，告警直接关联到网元
        const graphData = {
            nodes: [
                // 告警节点 - 分别在两个网元上
                { id: 'alarm1', type: 'alarm', name: '告警A' },
                { id: 'alarm2', type: 'alarm', name: '告警B' },

                // 网元 - 只有两个网元，直接相连
                { id: 'ne1', type: 'ne', name: '核心路由器R1' },
                { id: 'ne2', type: 'ne', name: '汇聚交换机S1' },
            ],
            edges: [
                // 网元间直接连接关系 (link) - 形成U型拓扑的关键
                { source: 'ne1', target: 'ne2', type: 'link' },

                // 告警与网元关联 (happen) - 直接关联到网元
                { source: 'alarm1', target: 'ne1', type: 'happen' },
                { source: 'alarm2', target: 'ne2', type: 'happen' },
            ]
        };

        // ========== U型网元故障组计算 ==========
        // 规则:两个网元各有1个告警,且网元间有link连接
        function calculateUFaultGroups() {
            const groups = [];

            // 统计每个网元上的告警数量
            const neAlarms = {};  // neId -> [alarmIds]
            graphData.edges.forEach(edge => {
                if (edge.type === 'happen') {
                    const deviceId = edge.target;
                    const alarmId = edge.source;
                    if (!neAlarms[deviceId]) neAlarms[deviceId] = [];
                    neAlarms[deviceId].push(alarmId);
                }
            });

            // 查找有link连接的两个网元对
            const linkedNEs = new Set();
            graphData.edges.forEach(edge => {
                if (edge.type === 'link') {
                    const ne1 = edge.source;
                    const ne2 = edge.target;
                    if (ne1 && ne2 && ne1 !== ne2) {
                        const key = [ne1, ne2].sort().join('-');
                        linkedNEs.add(key);
                    }
                }
            });

            // 检查每个link对是否都满足U型条件(每个网元有1个告警)
            linkedNEs.forEach(key => {
                const [ne1, ne2] = key.split('-');
                const alarms1 = neAlarms[ne1] || [];
                const alarms2 = neAlarms[ne2] || [];

                // U型条件:两个网元各有1个告警
                if (alarms1.length === 1 && alarms2.length === 1) {
                    groups.push({
                        ne1: ne1,
                        ne2: ne2,
                        alarm1: alarms1[0],
                        alarm2: alarms2[0]
                    });
                }
            });

            return groups;
        }

        // 计算U型故障组
        const uFaultGroups = calculateUFaultGroups();
        console.log('检测到的U型网元故障组:', uFaultGroups);

        // ========== 故障组告警间 trigger 边生成 ==========
        // 如果出现故障组,则涉及到的告警之间使用 trigger 连接
        uFaultGroups.forEach(group => {
            const alarms = [group.alarm1, group.alarm2];
            for (let i = 0; i < alarms.length; i++) {
                for (let j = i + 1; j < alarms.length; j++) {
                    const exists = graphData.edges.some(
                        e => e.source === alarms[i] && e.target === alarms[j] && e.type === 'trigger'
                    );
                    if (!exists) {
                        graphData.edges.push({
                            source: alarms[i],
                            target: alarms[j],
                            type: 'trigger'
                        });
                    }
                }
            }
        });

        // ========== Three.js 场景初始化 ==========
        const container = document.getElementById('container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a1a);

        // 星空背景
        const starGeo = new THREE.BufferGeometry();
        const starPositions = new Float32Array(2000 * 3);
        for (let i = 0; i < 2000 * 3; i++) {
            starPositions[i] = (Math.random() - 0.5) * 200;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.1 })));

        // 相机
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(15, 12, 20);

        // 渲染器
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        // 控制器
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // 灯光
        scene.add(new THREE.AmbientLight(0xffffff, 0.4));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // ========== 节点和边存储 ==========
        const nodeObjects = {};
        const nodeMeshes = [];

        // 颜色配置
        const nodeColors = {
            alarm: 0xff6b6b,
            ne: 0x00d4ff,
        };
        const edgeColors = {
            trigger: 0xffc107,  // 金黄色/琥珀色
            happen: 0xe91e63,
            link: 0x2196f3
        };

        // 创建节点
        function createNode(nodeData) {
            const group = new THREE.Group();
            const color = nodeColors[nodeData.type];
            const size = nodeData.type === 'alarm' ? 0.9 : 1.2;

            let geo, mesh;
            switch(nodeData.type) {
                case 'alarm':
                    // 告警: 八面体
                    geo = new THREE.OctahedronGeometry(size, 0);
                    mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
                        color, emissive: color, emissiveIntensity: 0.4,
                        metalness: 0.5, roughness: 0.3, flatShading: true
                    }));
                    break;
                case 'ne':
                    // 网元: 六边形棱柱（稍大一些）
                    geo = new THREE.CylinderGeometry(size, size, size * 0.6, 6);
                    mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
                        color, emissive: color, emissiveIntensity: 0.3,
                        metalness: 0.4, roughness: 0.4
                    }));
                    break;
            }

            mesh.userData = nodeData;
            group.add(mesh);

            // 光晕
            const glow = new THREE.Mesh(
                new THREE.SphereGeometry(size * 1.5, 16, 16),
                new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.12 })
            );
            group.add(glow);

            // 标签
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'white';
            ctx.font = 'bold 22px Microsoft YaHei';
            ctx.textAlign = 'center';
            ctx.fillText(nodeData.name, 128, 40);
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
                map: new THREE.CanvasTexture(canvas), transparent: true
            }));
            sprite.scale.set(3.5, 0.875, 1);
            sprite.position.y = size + 1.2;
            group.add(sprite);

            nodeMeshes.push(mesh);
            return group;
        }

        // 创建边
        function createEdge(edgeData, sourcePos, targetPos) {
            const color = edgeColors[edgeData.type];
            const dashed = edgeData.type === 'happen';

            let line;
            if (dashed) {
                // 虚线效果
                const segments = 8;
                const subLines = [];
                for (let i = 0; i < segments; i += 2) {
                    const start = new THREE.Vector3().lerpVectors(sourcePos, targetPos, i / segments);
                    const end = new THREE.Vector3().lerpVectors(sourcePos, targetPos, (i + 1) / segments);
                    subLines.push(new THREE.Line(
                        new THREE.BufferGeometry().setFromPoints([start, end]),
                        new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.8 })
                    ));
                }
                line = new THREE.Group();
                subLines.forEach(sl => line.add(sl));
            } else {
                // 实线
                line = new THREE.Line(
                    new THREE.BufferGeometry().setFromPoints([sourcePos, targetPos]),
                    new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.8, linewidth: 2 })
                );
            }

            // 箭头（trigger 和 link 边显示箭头）
            if (edgeData.type === 'trigger' || edgeData.type === 'link') {
                const dir = new THREE.Vector3().subVectors(targetPos, sourcePos).normalize();
                const arrow = new THREE.Mesh(
                    new THREE.ConeGeometry(0.2, 0.5, 8),
                    new THREE.MeshBasicMaterial({ color })
                );
                arrow.position.copy(targetPos).addScaledVector(dir, -0.4);
                arrow.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
                line.add(arrow);
            }

            return line;
        }

        // ========== 布局计算 ==========
        function calculateLayout() {
            const positions = {};

            // 简化布局:告警在上方，网元在下方，两者直接相连
            // 告警层 - 上方
            positions['alarm1'] = new THREE.Vector3(-4, 5, 0);
            positions['alarm2'] = new THREE.Vector3(4, 5, 0);

            // 网元层 - 下方，两个网元直接相连
            positions['ne1'] = new THREE.Vector3(-4, 0, 0);
            positions['ne2'] = new THREE.Vector3(4, 0, 0);

            return positions;
        }

        const nodePositions = calculateLayout();

        // ========== 构建图 ==========
        graphData.nodes.forEach(node => {
            const obj = createNode(node);
            obj.position.copy(nodePositions[node.id]);
            scene.add(obj);
            nodeObjects[node.id] = obj;
        });

        graphData.edges.forEach(edge => {
            scene.add(createEdge(edge, nodePositions[edge.source], nodePositions[edge.target]));
        });

        // ========== U型故障组可视化 ==========
        uFaultGroups.forEach(group => {
            const alarm1Pos = nodePositions[group.alarm1];
            const alarm2Pos = nodePositions[group.alarm2];

            // 计算包围圈中心点（两个告警的中心）
            const alarmPositions = [alarm1Pos, alarm2Pos];
            let centerX = 0, centerY = 0, centerZ = 0;
            alarmPositions.forEach(pos => {
                centerX += pos.x; centerY += pos.y; centerZ += pos.z;
            });
            centerX /= alarmPositions.length;
            centerY /= alarmPositions.length;
            centerZ /= alarmPositions.length;

            // 创建椭圆包围圈，将告警包裹起来
            const ellipsePoints = [];
            for (let i = 0; i <= 64; i++) {
                const angle = (i / 64) * Math.PI * 2;
                ellipsePoints.push(new THREE.Vector3(
                    centerX + Math.cos(angle) * 4,
                    centerY + Math.sin(angle) * 0.8,
                    centerZ
                ));
            }

            const uCurve = new THREE.LineLoop(
                new THREE.BufferGeometry().setFromPoints(ellipsePoints),
                new THREE.LineBasicMaterial({ color: 0xff6600, transparent: true, opacity: 0.9 })
            );
            scene.add(uCurve);

            // U型标签 - 放在告警中心上方
            const labelCanvas = document.createElement('canvas');
            labelCanvas.width = 512; labelCanvas.height = 128;
            const ctx = labelCanvas.getContext('2d');
            ctx.fillStyle = 'rgba(255, 102, 0, 0.9)';
            ctx.beginPath();
            roundRect(ctx, 0, 0, 512, 128, 16);
            ctx.fill();
            ctx.fillStyle = 'white';
            ctx.font = 'bold 32px Microsoft YaHei';
            ctx.textAlign = 'center';
            ctx.fillText('U型网元故障组', 256, 45);
            ctx.font = '26px Microsoft YaHei';
            ctx.fillStyle = '#fffde7';
            ctx.fillText(`2个网元,各1个告警`, 256, 85);

            const labelSprite = new THREE.Sprite(new THREE.SpriteMaterial({
                map: new THREE.CanvasTexture(labelCanvas), transparent: true
            }));
            labelSprite.scale.set(6, 1.5, 1);
            labelSprite.position.set(centerX, centerY + 3, centerZ);
            scene.add(labelSprite);

            // 更新右侧面板
            const ne1Node = graphData.nodes.find(n => n.id === group.ne1);
            const ne2Node = graphData.nodes.find(n => n.id === group.ne2);
            const alarm1Node = graphData.nodes.find(n => n.id === group.alarm1);
            const alarm2Node = graphData.nodes.find(n => n.id === group.alarm2);

            document.getElementById('faultGroupList').innerHTML += `
                <div class="fault-group">
                    <div class="fault-group-title">⚠️ U型网元故障组</div>
                    <div class="fault-group-info">网元1: <strong>${ne1Node?.name || group.ne1}</strong></div>
                    <div class="fault-group-info">告警: <span class="alarm-tag">${alarm1Node?.name || group.alarm1}</span></div>
                    <div style="border-top:1px dashed rgba(255,102,0,0.3);margin:8px 0;"></div>
                    <div class="fault-group-info">网元2: <strong>${ne2Node?.name || group.ne2}</strong></div>
                    <div class="fault-group-info">告警: <span class="alarm-tag">${alarm2Node?.name || group.alarm2}</span></div>
                </div>
            `;
        });

        // 如果有故障组,隐藏"暂无"提示
        if (uFaultGroups.length > 0) {
            document.getElementById('noFaultGroup').style.display = 'none';
        }

        // 圆角矩形辅助函数
        function roundRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        // ========== 窗口大小调整 ==========
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ========== 动画循环 ==========
        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.001;

            // 光晕呼吸效果
            Object.values(nodeObjects).forEach((obj, i) => {
                if (obj.children[1]) {
                    obj.children[1].material.opacity = 0.12 + Math.sin(time * 2 + i * 0.5) * 0.04;
                }
            });

            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
