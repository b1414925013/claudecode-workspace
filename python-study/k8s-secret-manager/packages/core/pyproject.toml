[project]
name = "ksm-core"
version = "0.1.0"
description = "K8s Secret Manager — Shared Core Library"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "tortoise-orm>=0.24.0",
    "aerich>=0.8.0",
    "aiomysql>=0.2.0",
    "cryptography>=44.0.0",
    "pyjwt>=2.10.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.12",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "slowapi>=0.1.9",
    "kubernetes>=31.0.0",
    "pyyaml>=6.0.2",
    "httpx>=0.28.0",
    "python-dotenv>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
